# group: "Deleon" or "Personal". featured: shown on the home page.

- title: Otea
  group: Deleon
  featured: true
  years: "2025 to now"
  url: "/writing/otea-daily-metabolomics/"
  summary: >-
    A portable biomolecule reader that runs capillary electrophoresis with laser-induced fluorescence
    (CE-LIF) on disposable plastic microfluidic chips. It runs autonomously in a participant's home: under
    10 µL of sample, 2-minute separations, under 3 kg and 12 W, about $1 per analysis, and about 3%
    chip-to-chip variation. Its design comes from two decades of NASA work on autonomous instruments for
    Mars and Europa.
  tags: [Instruments, Metabolomics]

- title: Exploreon
  group: Deleon
  featured: true
  years: "2026"
  url: "/writing/information-space/"
  summary: >-
    An experiment design model that chooses which measurement to take next, for each person, to teach a
    world model of human metabolism the most per sample. In simulated studies it reached the same final
    accuracy as Claude Opus 5.5 and Monte Carlo sampling with 7x and 12x less data.
  tags: [AI, Experiment design]

- title: Juniper
  group: Deleon
  featured: true
  years: "2026"
  summary: >-
    An agentic control loop for the Otea that interprets each run, considers the literature and the
    settings tried before, and proposes the next run. It tunes seven voltage and timing settings per
    campaign, scores each output with an autonomous grader (signal-to-noise, resolution, and more), and
    cites the evidence behind each choice. It replaced factorial design of experiments for our method development.
  tags: [AI, Instruments, Agents]

- title: Daily human biochemistry cohort
  group: Deleon
  years: "2025 to now"
  summary: >-
    A longitudinal study of daily dried urine spots, collected at home and mailed in with no cold chain,
    matched to daily wellness surveys and Garmin or Whoop wearable data. More than 60 participants, over
    2,500 banked samples, and over 57,500 amine measurements. Each participant has a personal time-series
    model of their daily biochemistry that updates with every new sample.
  tags: [Human data, Metabolomics]

- title: Swarm BLAST
  group: Personal
  featured: true
  years: "October 2026"
  url: "https://chadianpoz.github.io/swarm-blast/"
  code: "https://github.com/vikasreddy85/swarm-blast"
  summary: >-
    Built at the AI Swarm Dynamics Hackathon (AI Village and Grove Research) with Vikas Reddy and Antonio
    Varagnolo. A testbed of 8-agent teams across six large language models, with detectors inspired by
    BLAST (the DNA sequence-search tool) that find self-replicating prompts as they spread between agents.
    Lexical, semantic, and behavioral detectors, transmission trees, and an epidemic-style simulator.
    Detection worked even when agents reworded the prompt (AUC up to 0.98).
  tags: [AI safety, Agents]

- title: Submersible water activity meter (SWAM)
  group: Research
  years: "2022"
  summary: >-
    An instrument for measuring water activity, the amount of water available to life, directly inside
    hypersaline lakes and brine pools. Developed with Chris Carr at Georgia Tech. Provisional patent filed.
  tags: [Instruments, Brines]

- title: Field campaigns
  group: Research
  years: "2021 to 2023"
  summary: >-
    Led sampling at the Orca Basin deep hypersaline anoxic basin in the Gulf of Mexico (R/V Point Sur,
    2023), the transient acidic lakes of Western Australia (2022), and Valles Caldera, New Mexico (2021).
  tags: [Field work, Brines]
