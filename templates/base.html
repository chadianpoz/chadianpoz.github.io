<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site.name }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ site.description }}{% endblock %}">
{% block canonical %}<link rel="canonical" href="{{ site.url }}{{ path }}">{% endblock %}
<meta property="og:title" content="{{ self.title() }}">
<meta property="og:description" content="{{ self.description() }}">
<meta property="og:type" content="website">
<link rel="alternate" type="application/rss+xml" title="{{ site.name }}" href="/feed.xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
<header class="site-header">
  <a class="wordmark" href="/">{{ site.name }}</a>
  <nav>
    {% for item in site.nav %}<a href="{{ item.url }}"{% if (item.url == '/' and path == '/') or (item.url != '/' and path.startswith(item.url)) %} class="active"{% endif %}>{{ item.title }}</a>{% endfor %}
  </nav>
</header>
<main class="{% block mainclass %}{% endblock %}">
{% block content %}{% endblock %}
</main>
<footer class="site-footer">
  <div class="links">{% for l in site.links %}<a href="{{ l.url }}">{{ l.label }}</a>{% endfor %}</div>
  <div class="fine">© {{ 2026 }} {{ site.name }}</div>
</footer>
</body>
</html>
