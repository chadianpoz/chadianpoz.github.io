name: Build and deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * *"   # daily, to pick up new Substack posts
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jinja2 markdown pyyaml
      - name: Import new posts from RSS feeds and build
        run: python build.py --fetch
      - name: Save imported posts to the repo
        run: |
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add content/posts
          git diff --cached --quiet || (git commit -m "Import new posts from feeds" && git push)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
